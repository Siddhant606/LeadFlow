services:
  mongodb:
    image: mongo:7.0
    container_name: leadflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: leadflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: leadflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/leadflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=leadflow-super-secret-jwt-key-german-mortgage-saas-2025
      - JWT_EXPIRES_IN=7d
      - WEBHOOK_API_KEY=lf_webhook_secret_key_89741b2c349
      - STORAGE_DIR=/app/uploads
      - EMAIL_PROVIDER=console
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - document_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: leadflow_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
  document_uploads:
